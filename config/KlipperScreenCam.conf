# Install to ~/printer_data/config/KlipperScreenCam.conf.
# Relative filesystem paths are resolved against this configuration file.
[main]
moonraker_url = http://127.0.0.1:7125
# Base URL for relative camera stream paths, usually the Mainsail nginx server.
web_url = http://127.0.0.1

# Fixed startup camera: prefer its Moonraker UID (renaming does not affect it).
# A camera name also works. Empty value selects the first enabled camera.
default_camera =

# auto follows KlipperScreen; otherwise a locale filename without .json.
language = auto
klipperscreen_directory = ~/KlipperScreen
# Empty: discover the standard KlipperScreen configuration locations.
klipperscreen_config =
# auto follows KlipperScreen. Alternatively z-bolt, colorized, material-dark...
theme = auto
theme_poll_seconds = 2

[display]
# X11 display and camera window position. This app does not reconfigure HDMI.
display = :0
xauthority = ~/.Xauthority
x = 1024
y = 0
width = 1024
height = 600
menu_min_width = 410
gear_size = 88
hide_cursor = true
# With one enabled camera, hide its name; keep the menu for pause/resume.
hide_name_single_camera = true
# WebKit rendering policy: off (compatible default), auto (on-demand), on (always).
# GPU/driver support still determines actual acceleration; MJPEG decode may stay on CPU.
hardware_acceleration = off

[stream]
# Maximum FPS for this display only; Mainsail/Crowsnest settings stay unchanged.
# Frames are dropped without decoding or re-encoding. Use 30 for a higher limit.
# Use unlimited to disable the local limit. Menu changes last until service restart.
max_fps = 15
# Start with no local stream until it is enabled from the on-screen menu.
start_paused = false
reconnect_initial_seconds = 2
reconnect_max_seconds = 30
request_timeout_seconds = 5
