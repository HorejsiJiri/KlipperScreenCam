name: Checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python launcher.py --check-locales
      - run: python launcher.py --config config/KlipperScreenCam.conf --check
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh
      - name: Check browser JavaScript
        run: |
          python -c "from pathlib import Path; t=Path('web/index.html').read_text(); Path('/tmp/ksc-ui.js').write_text(t.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/ksc-ui.js
      - name: Test touch interface
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node tests/test_ui.cjs
